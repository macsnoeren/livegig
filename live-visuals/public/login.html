<!doctype html>
<html lang="nl">
<head>
    <title>LiveGig - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #111; min-height: 100vh; display: flex; align-items: center; }
        .login-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 2rem; width: 100%; max-width: 380px; }
        .brand { font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: 2px; }
        .brand span { color: #e63946; }
        #error-msg { display: none; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand">LIVE<span>GIG</span></div>
            <p class="text-secondary mt-1">Drummer's click track &amp; setlist app</p>
        </div>

        <form id="login-form">
            <div class="mb-3">
                <label class="form-label text-light">Gebruikersnaam</label>
                <input type="text" id="username" class="form-control bg-dark text-light border-secondary" autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Wachtwoord</label>
                <input type="password" id="password" class="form-control bg-dark text-light border-secondary" autocomplete="current-password">
            </div>
            <div id="error-msg" class="alert alert-danger py-2"></div>
            <button type="submit" class="btn btn-danger w-100 fw-bold">Inloggen</button>
        </form>
    </div>
</div>

<script src="api.js"></script>
<script>
    // Already logged in?
    if (localStorage.getItem('lg_token')) window.location.href = '/index.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        try {
            const data = await api.login(username, password);
            storeAuth(data.token, data.user);
            window.location.href = '/index.html';
        } catch (err) {
            errEl.textContent = err.message || 'Inloggen mislukt';
            errEl.style.display = 'block';
        }
    });
</script>
</body>
</html>
