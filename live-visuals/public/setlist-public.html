<!doctype html>
<html lang="nl">
<head>
    <title>LiveGig - Setlijst</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #111; color: #eee; }
        .song-row { border-bottom: 1px solid #2a2a2a; padding: 10px 0; }
        .song-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
<div class="container py-4">
    <div class="mb-3">
        <span class="fs-5 fw-bold text-white">LIVE<span class="text-danger">GIG</span></span>
    </div>

    <div id="loading" class="text-secondary">Laden...</div>
    <div id="content" style="display:none">
        <h2 id="sl-title" class="mb-1"></h2>
        <p id="sl-meta" class="text-secondary mb-4"></p>
        <div id="sl-songs"></div>
    </div>
    <div id="error" class="alert alert-danger" style="display:none"></div>
</div>

<script>
    const token = location.pathname.split('/s/')[1];

    async function load() {
        try {
            const res = await fetch(`/api/setlists/public/${token}`);
            if (!res.ok) throw new Error((await res.json()).error || 'Niet gevonden');
            const sl = await res.json();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('sl-title').textContent = sl.title;
            document.getElementById('sl-meta').textContent = `${sl.songs.length} nummers`;

            const el = document.getElementById('sl-songs');
            sl.songs.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'song-row';
                div.innerHTML = `
                    <span class="text-secondary me-2">${i+1}.</span>
                    <strong>${esc(s.title)}</strong>
                    <span class="text-secondary ms-2">${esc(s.artist)}</span>
                    ${s.bpm ? `<span class="badge bg-secondary ms-2">${s.bpm} BPM</span>` : ''}
                    ${s.starts ? `<span class="text-secondary small ms-2">start: ${esc(s.starts)}</span>` : ''}
                `;
                el.appendChild(div);
            });
        } catch(e) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').textContent = e.message;
            document.getElementById('error').style.display = 'block';
        }
    }

    function esc(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    load();
</script>
</body>
</html>
