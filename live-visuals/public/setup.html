<!doctype html>
<html lang="nl">
<head>
    <title>LiveGig - Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #111; min-height: 100vh; display: flex; align-items: center; }
        .setup-card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 2rem; width: 100%; max-width: 420px; }
        .brand { font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: 2px; }
        .brand span { color: #e63946; }
        #error-msg { display: none; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="setup-card">
        <div class="text-center mb-4">
            <div class="brand">LIVE<span>GIG</span></div>
            <h5 class="text-light mt-3">Eerste keer instellen</h5>
            <p class="text-secondary">Maak een admin-account aan om te beginnen.</p>
        </div>

        <form id="setup-form">
            <div class="mb-3">
                <label class="form-label text-light">Gebruikersnaam *</label>
                <input type="text" id="username" class="form-control bg-dark text-light border-secondary" autofocus autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Wachtwoord * <span class="text-secondary small">(minimaal 6 tekens)</span></label>
                <input type="password" id="password" class="form-control bg-dark text-light border-secondary" autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label text-light">Wachtwoord bevestigen *</label>
                <input type="password" id="password2" class="form-control bg-dark text-light border-secondary" autocomplete="new-password">
            </div>
            <div id="error-msg" class="alert alert-danger py-2"></div>
            <button type="submit" class="btn btn-danger w-100 fw-bold">Admin aanmaken &amp; starten</button>
        </form>
    </div>
</div>

<script src="api.js"></script>
<script>
    // Check if setup is still needed; if not, go to login
    fetch('/api/auth/setup-required')
        .then(r => r.json())
        .then(data => { if (!data.required) window.location.href = '/login.html'; });

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        if (!username) { errEl.textContent = 'Gebruikersnaam is verplicht'; errEl.style.display = 'block'; return; }
        if (password !== password2) { errEl.textContent = 'Wachtwoorden komen niet overeen'; errEl.style.display = 'block'; return; }

        try {
            const res = await fetch('/api/auth/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Setup mislukt');

            storeAuth(data.token, data.user);
            window.location.href = '/index.html';
        } catch (err) {
            errEl.textContent = err.message;
            errEl.style.display = 'block';
        }
    });
</script>
</body>
</html>
