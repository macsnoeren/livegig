<!doctype html>
<html lang="nl">
<head>
    <title>LiveGig - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #111; color: #eee; }
        .navbar { background-color: #1a1a1a; border-bottom: 1px solid #333; }
        .table-dark { background-color: #1e1e1e; }
        .table-dark td, .table-dark th { border-color: #333; }
        .badge-admin { background-color: #e63946; }
        .badge-user { background-color: #457b9d; }
    </style>
</head>
<body>
<nav class="navbar fixed-top px-3">
    <div class="d-flex align-items-center gap-3 w-100">
        <a href="/index.html" class="text-decoration-none">
            <span class="fs-5 fw-bold text-white">LIVE<span class="text-danger">GIG</span></span>
        </a>
        <span class="text-secondary">/ Admin</span>
        <div class="ms-auto d-flex gap-2">
            <a href="/songs.html" class="btn btn-outline-secondary btn-sm">Nummers</a>
            <a href="/setlists.html" class="btn btn-outline-secondary btn-sm">Setlijsten</a>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Uitloggen</button>
        </div>
    </div>
</nav>

<div class="container" style="padding-top: 80px; padding-bottom: 40px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Gebruikersbeheer</h4>
        <button class="btn btn-danger" onclick="openModal()">+ Gebruiker toevoegen</button>
    </div>

    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Gebruikersnaam</th>
                    <th>Rol</th>
                    <th>Aangemaakt</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="modal-title">Gebruiker toevoegen</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                <div class="mb-2">
                    <label class="form-label">Gebruikersnaam *</label>
                    <input type="text" id="edit-username" class="form-control bg-secondary text-light border-0">
                </div>
                <div class="mb-2">
                    <label class="form-label">Wachtwoord <span id="pw-hint" class="text-secondary small">(leeg = niet wijzigen)</span></label>
                    <input type="password" id="edit-password" class="form-control bg-secondary text-light border-0" autocomplete="new-password">
                </div>
                <div class="mb-2">
                    <label class="form-label">Rol</label>
                    <select id="edit-role" class="form-select bg-secondary text-light border-0">
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div id="modal-error" class="alert alert-danger py-1 mt-2" style="display:none"></div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuleren</button>
                <button type="button" class="btn btn-danger" onclick="saveUser()">Opslaan</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script>
if (!requireLogin()) throw new Error('Not logged in');
if (!requireAdminRole()) throw new Error('Not admin');

let _users = [];
const modal = new bootstrap.Modal(document.getElementById('userModal'));

function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadUsers() {
    _users = await api.getUsers();
    renderUsers();
}

function renderUsers() {
    const tbody = document.getElementById('user-list');
    tbody.innerHTML = '';
    _users.forEach(u => {
        const roleBadge = u.role === 'admin'
            ? `<span class="badge badge-admin">admin</span>`
            : `<span class="badge badge-user">user</span>`;
        const created = new Date(u.created_at).toLocaleDateString('nl-NL');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${u.id}</td>
            <td>${escHtml(u.username)}</td>
            <td>${roleBadge}</td>
            <td class="text-secondary">${created}</td>
            <td class="text-end">
                <button class="btn btn-outline-secondary btn-sm me-1" onclick="openModal(${u.id})">&#9998;</button>
                <button class="btn btn-outline-danger btn-sm" onclick="deleteUser(${u.id})">&#128465;</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function openModal(id) {
    document.getElementById('edit-id').value = id || '';
    document.getElementById('edit-username').value = '';
    document.getElementById('edit-password').value = '';
    document.getElementById('edit-role').value = 'user';
    document.getElementById('modal-error').style.display = 'none';

    if (id) {
        document.getElementById('modal-title').textContent = 'Gebruiker bewerken';
        document.getElementById('pw-hint').style.display = 'inline';
        const u = _users.find(x => x.id === id);
        if (u) {
            document.getElementById('edit-username').value = u.username;
            document.getElementById('edit-role').value = u.role;
        }
    } else {
        document.getElementById('modal-title').textContent = 'Gebruiker toevoegen';
        document.getElementById('pw-hint').style.display = 'none';
    }
    modal.show();
}

async function saveUser() {
    const id = document.getElementById('edit-id').value;
    const data = {
        username: document.getElementById('edit-username').value.trim(),
        password: document.getElementById('edit-password').value || undefined,
        role: document.getElementById('edit-role').value,
    };
    if (!data.password) delete data.password;

    const errEl = document.getElementById('modal-error');
    errEl.style.display = 'none';
    try {
        if (id) {
            await api.updateUser(id, data);
        } else {
            await api.createUser(data);
        }
        modal.hide();
        await loadUsers();
    } catch(e) {
        errEl.textContent = e.message;
        errEl.style.display = 'block';
    }
}

async function deleteUser(id) {
    const u = _users.find(x => x.id === id);
    if (!confirm(`Gebruiker "${u ? u.username : id}" verwijderen?`)) return;
    try {
        await api.deleteUser(id);
        await loadUsers();
    } catch(e) {
        alert(e.message);
    }
}

loadUsers();
</script>
</body>
</html>
